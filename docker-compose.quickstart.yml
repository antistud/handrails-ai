services:
  handrails:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${HANDRAILS_PORT:-3100}:3100"
    environment:
      HOST: "0.0.0.0"
      HANDRAILS_HOME: "/handrails"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      HANDRAILS_DEPLOYMENT_MODE: "authenticated"
      HANDRAILS_DEPLOYMENT_EXPOSURE: "private"
      HANDRAILS_PUBLIC_URL: "${HANDRAILS_PUBLIC_URL:-http://localhost:3100}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
    volumes:
      - "${HANDRAILS_DATA_DIR:-./data/docker-handrails}:/handrails"
