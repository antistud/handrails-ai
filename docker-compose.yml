services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: handrails
      POSTGRES_PASSWORD: handrails
      POSTGRES_DB: handrails
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handrails -d handrails"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build: .
    ports:
      - "3100:3100"
    environment:
      DATABASE_URL: postgres://handrails:handrails@db:5432/handrails
      PORT: "3100"
      SERVE_UI: "true"
      HANDRAILS_DEPLOYMENT_MODE: "authenticated"
      HANDRAILS_DEPLOYMENT_EXPOSURE: "private"
      HANDRAILS_PUBLIC_URL: "${HANDRAILS_PUBLIC_URL:-http://localhost:3100}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
    volumes:
      - handrails-data:/handrails
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  handrails-data:
